[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-logic"
version = "0.1.0"
description = "Fuzzy inference systems, neuro-fuzzy models, and a block-diagram simulation core"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
# ANFIS work has not started; torch is not needed to run anything in the repo today.
anfis = ["torch>=2.2"]
# The block editor. Deliberately optional: `fuzzy.sim` must never import a web
# framework, and a headless simulation run must not need one installed.
editor = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx2>=2.9",  # required by starlette's TestClient (it deprecated httpx)
]

[tool.setuptools]
packages = ["fuzzy", "editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette's TestClient warns about httpx on import; it is not our warning.
filterwarnings = ["error::UserWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No `python_version` pin: it makes mypy parse the *installed* numpy stubs under
# an older grammar, and numpy's stubs use 3.12+ `type` statements. Letting mypy
# follow the running interpreter is also what the CI matrix actually wants.
files = ["fuzzy", "editor"]
ignore_missing_imports = true
