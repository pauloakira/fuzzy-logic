<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fuzzy-logic block editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Block editor</h1>
    <span id="status" data-testid="status">loading…</span>
  </header>

  <main>
    <aside>
      <section>
        <h2>Diagrams</h2>
        <ul id="diagrams" data-testid="diagrams"></ul>
      </section>

      <section id="summary" data-testid="summary" hidden>
        <h2>Diagram</h2>
        <h3 id="summary-name"></h3>
        <p><span data-testid="block-count"></span> blocks,
           <span data-testid="connection-count"></span> connections,
           <span data-testid="state-count"></span> states</p>
        <ul id="advice" data-testid="advice"></ul>
        <p id="validity" data-testid="validity"></p>
      </section>

      <section id="selection" data-testid="selection" hidden>
        <h2>Selected</h2>
        <h3 data-testid="selected-name"></h3>
        <p data-testid="selected-type"></p>
        <dl data-testid="selected-params"></dl>
      </section>

      <section>
        <h2>Palette</h2>
        <ul id="palette" data-testid="palette"></ul>
      </section>
    </aside>

    <section id="canvas-panel">
      <h2>Canvas</h2>
      <div id="toolbar" data-testid="toolbar" hidden>
        <label>Add
          <select id="add-block" data-testid="add-block"></select>
        </label>
        <button type="button" id="delete-selected" data-testid="delete-selected"
                disabled>Delete selected</button>
        <span id="dirty" data-testid="dirty" hidden>unsaved changes</span>
        <span class="spacer"></span>
        <label>Save to
          <input type="text" id="save-path" data-testid="save-path" size="34">
        </label>
        <button type="button" id="save" data-testid="save">Save</button>
        <span id="save-status" data-testid="save-status"></span>
      </div>
      <svg id="canvas" data-testid="canvas" role="img"
           aria-label="Block diagram"></svg>
      <p id="canvas-empty" data-testid="canvas-empty">Choose a diagram to draw it.</p>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
